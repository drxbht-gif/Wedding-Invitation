<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Guestbook Admin</title><style>body{margin:0;background:#fff8ec;color:#35251f;font:16px/1.5 system-ui}header{background:#4d1223;color:#fff8ec;text-align:center;padding:24px}h1,h2{font-family:Georgia,serif;font-weight:400}main{max-width:850px;margin:24px auto;padding:0 14px}.panel,.entry{background:#fffdf8;border:1px solid #e5d4b3;border-radius:16px;padding:18px;margin-bottom:14px}label{display:block;margin:12px 0 5px;font-weight:650}input{width:100%;padding:12px;box-sizing:border-box;border:1px solid #d9cbb1;border-radius:9px;font:inherit}button{border:0;border-radius:99px;padding:11px 16px;margin:8px 6px 0 0;font-weight:700;cursor:pointer}.primary{background:#741b31;color:white}.approve{background:#176b48;color:white}.danger{background:#8c2435;color:white}.secondary{background:#efe4d1}.hidden{display:none!important}.status,.meta{color:#78665c;font-size:.9rem;overflow-wrap:anywhere}.message{white-space:pre-wrap;overflow-wrap:anywhere}.media{max-width:100%;width:min(100%,520px)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.active{outline:2px solid #c59b55}</style></head><body><header><h1>Wedding Guestbook</h1><p>Private moderation dashboard · Simmi &amp; Dheeraj</p></header><main><section id="login" class="panel"><h2>Administrator sign in</h2><p class="meta">Use the admin account created in Supabase Authentication.</p><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">Sign in</button></form><div id="loginStatus" class="status"></div></section><section id="dashboard" class="hidden"><div class="panel"><div class="row"><div><h2>Manage wishes</h2><div id="who" class="meta"></div></div><div><button id="refresh" class="secondary">Refresh</button><button id="logout" class="secondary">Sign out</button></div></div><div id="filters"><button class="secondary active" data-filter="pending">Pending</button><button class="secondary" data-filter="approved">Approved / Published</button><button class="secondary" data-filter="all">All entries</button></div><div id="status" class="status">Loading…</div></div><div id="entries"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// Paste the same URL and publishable/anon key used by index.html. NEVER use a service_role/secret key.
const SUPABASE_URL="https://arkrvxtjwnctdutdpmti.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_m6SL5Ze6E2midQgTiqnLKQ_yqLUakvQ";
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('PASTE_')&&!SUPABASE_PUBLISHABLE_KEY.includes('PASTE_');
const sb=configured&&window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;const $=id=>document.getElementById(id);let filter='pending';
function msg(id,t){$(id).textContent=t}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function signedIn(user){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');msg('who',user.email||'Administrator')}
async function load(){msg('status','Loading entries…');$('refresh').disabled=true;let q=sb.from('wedding_guestbook').select('id,name,message,entry_type,media_path,media_type,approved,created_at').order('created_at',{ascending:false}).limit(200);if(filter==='pending')q=q.eq('approved',false);if(filter==='approved')q=q.eq('approved',true);const {data,error}=await q;$('refresh').disabled=false;if(error){msg('status','Could not load: '+error.message);return}const root=$('entries');root.replaceChildren();if(!data.length){msg('status','No entries in this view.');return}msg('status',data.length+' entries shown (max 200).');for(const x of data){let media='';if(x.media_path&&x.media_type){const {data:u}=sb.storage.from('wedding-greetings').getPublicUrl(x.media_path);if(u?.publicUrl){const url=esc(u.publicUrl);media=x.media_type.startsWith('video/')?`<video class="media" controls preload="metadata" src="${url}"></video>`:x.media_type.startsWith('audio/')?`<audio class="media" controls preload="metadata" src="${url}"></audio>`:`<p><a target="_blank" rel="noopener" href="${url}">Open greeting file</a></p>`}}
const actions=x.approved?`<button class="secondary" data-action="hide" data-id="${x.id}">Hide from public</button><button class="danger" data-action="delete" data-id="${x.id}">Delete permanently</button>`:`<button class="approve" data-action="approve" data-id="${x.id}">Approve &amp; publish</button><button class="danger" data-action="delete" data-id="${x.id}">Reject &amp; delete</button>`;const el=document.createElement('article');el.className='entry';el.innerHTML=`<div class="row"><div><strong>${esc(x.name)}</strong><div class="meta">${new Date(x.created_at).toLocaleString()} · ID ${x.id}</div></div><span class="meta">${esc(x.entry_type)} · ${x.approved?'Published':'Pending'}</span></div><p class="message">${esc(x.message||(x.entry_type==='audio'?'Voice greeting':x.entry_type==='video'?'Video greeting':'No text message'))}</p>${media}<div>${actions}</div>`;root.append(el)}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!sb){msg('loginStatus','Setup needed: paste the Project URL and publishable key into admin.html.');return}msg('loginStatus','Signing in…');const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg('loginStatus','Sign-in failed: '+error.message);return}signedIn(data.user);await load()});$('refresh').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut();$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');msg('loginStatus','Signed out.')};$('filters').onclick=async e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));await load()};$('entries').onclick=async e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=Number(b.dataset.id),a=b.dataset.action;if(a==='delete'&&!confirm('Permanently delete this entry and its uploaded audio/video file if present? This cannot be undone.'))return;if(a==='hide'&&!confirm('Hide this wish from the public website? It will remain pending in the admin list.'))return;b.disabled=true;let r;if(a==='approve')r=await sb.from('wedding_guestbook').update({approved:true}).eq('id',id).eq('approved',false);else if(a==='hide')r=await sb.from('wedding_guestbook').update({approved:false}).eq('id',id).eq('approved',true);else{const {data:item,error:re}=await sb.from('wedding_guestbook').select('media_path').eq('id',id).single();if(re){msg('status','Could not check media: '+re.message);b.disabled=false;return}r=await sb.from('wedding_guestbook').delete().eq('id',id);if(!r.error&&item?.media_path){const {error:se}=await sb.storage.from('wedding-greetings').remove([item.media_path]);if(se)msg('status','Entry deleted, but media-file deletion failed: '+se.message)}}if(r.error){msg('status','Action failed: '+r.error.message);b.disabled=false;return}if(!r.error)msg('status',a==='approve'?'Wish approved and published.':a==='hide'?'Wish hidden from public.':'Entry deleted.');await load()};
if(!configured)msg('loginStatus','Setup needed: edit admin.html and paste the Project URL and publishable key from index.html.');else if(sb)sb.auth.getSession().then(async({data})=>{if(data.session){signedIn(data.session.user);await load()}}).then(()=>sb.auth.onAuthStateChange((_e,s)=>{if(!s){$('dashboard').classList.add('hidden');$('login').classList.remove('hidden')}}));
</script></body></html>
